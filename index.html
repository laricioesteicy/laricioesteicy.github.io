  Array.from(deck.children).forEach((img,i)=>{
    let distance=(i-slide+pics.length)%pics.length;
    if(distance>pics.length/2)distance-=pics.length;
    const side=Math.sign(distance), depth=Math.min(Math.abs(distance),3);
    img.style.setProperty('--shift',(side*depth*60)+'%');
    img.style.setProperty('--angle',(side*Math.min(depth,2)*42)+'deg');
    img.style.setProperty('--z',(-depth*135)+'px');

function scatterPetals(origin){
  if(reduced.matches || typeof Element.prototype.animate!=='function')return;
  const layer=el('div','opening-petals');
  layer.setAttribute('aria-hidden','true');document.body.append(layer);
  const reach=Math.min(innerWidth*.55,innerHeight*.54,430);
  const animations=[];
  for(let i=0;i<40;i++){
    const petal=el('i');
    const angle=2*Math.PI*(i+Math.random()*.65)/40;
    const radius=reach*(.46+Math.random()*.57);
    const dx=Math.cos(angle)*radius,dy=Math.sin(angle)*radius;
    const spin=(Math.random()-.5)*450;
    petal.style.left=origin.x+'px';petal.style.top=origin.y+'px';layer.append(petal);
    const flight=petal.animate([
      {transform:'translate(-50%,-50%) scale(.35)',opacity:0},
      {transform:'translate('+dx*.27+'px,'+dy*.27+'px) rotate('+spin*.2+'deg)',opacity:1,offset:.15},
      {transform:'translate('+dx*.85+'px,'+dy*.85+'px) rotate('+spin*.7+'deg)',opacity:.9,offset:.57},
      {transform:'translate('+dx+'px,'+(dy+68)+'px) rotate('+spin+'deg) scale(.65)',opacity:0}
    ],{duration:1600+Math.random()*500,easing:'ease-out',fill:'both'});
    animations.push(flight.finished);
  }
  Promise.allSettled(animations).then(()=>layer.remove());
}

const playReading=byId('play-reading');
let readingFrame=0, previousFrame=0, readingY=0, resumeAt=0;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
function stopReading(){
  cancelAnimationFrame(readingFrame);readingFrame=0;previousFrame=0;
  const nearEnd=window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-3;
  playReading.textContent=nearEnd?'Rever convite':'Reproduzir convite';
  playReading.setAttribute('aria-pressed','false');
}
function tickReading(time){
  // Native scrolling to an input or button gives the visitor control of the page.
  if(!opened||document.hidden||Math.abs(window.scrollY-readingY)>3){stopReading();return;}
  const delta=previousFrame?Math.min(65,time-previousFrame):0;
  previousFrame=time;
  if(time>=resumeAt){
    const end=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
    readingY=Math.min(end,readingY+delta*Math.max(26,Math.min(46,innerHeight*.048))/1000);
    window.scrollTo({top:readingY,behavior:'instant'});
    if(readingY>=end){stopReading();return;}
  }
  readingFrame=requestAnimationFrame(tickReading);
}
function startReading(){
  if(readingFrame||!opened)return;
  if(window.scrollY+innerHeight>=document.documentElement.scrollHeight-3)window.scrollTo(0,0);
  readingY=window.scrollY;previousFrame=0;resumeAt=performance.now()+1100;
  playReading.textContent='Pausar convite';playReading.setAttribute('aria-pressed','true');
  readingFrame=requestAnimationFrame(tickReading);
}

async function loadGuestCard(){
  const run=++guestLoad,params=new URLSearchParams(location.hash.slice(1));
  const token=(location.pathname.startsWith('/convite/')?location.pathname.slice('/convite/'.length):params.get('convite')),slug=params.get('cartao'),name=(params.get('para')||'').slice(0,150);
  const legacy=!token&&name&&/^[a-z0-9-]{1,180}$/i.test(slug||'');
  const ref=token|| (legacy?slug:'');
  guestCard={convidado:name,mesa:tableName((params.get('mesa')||'').slice(0,100)),lugares:name?suggestSeats(name):0};
  if(!ref){renderPage();return;}
  guestCard.loading=true;renderPage();
  try{
    const record=await attendanceRequest('/api/resposta/'+encodeURIComponent(ref));if(run!==guestLoad)return;
    guestCard={...record,ref};
  }catch(error){
    if(run!==guestLoad)return;
    guestCard.loading=false;
    if(legacy&&error.status===404)guestCard.error='Esta ligação é antiga. Peça à organização a sua ligação pessoal actualizada.';
    else guestCard.error=error.message||'Não foi possível abrir o convite.';
  }
  renderPage();
}
function describeReply(record){
  if(record.presencas==null)return 'Aguarda resposta';
  if(record.presencas===0)return 'Não comparece';
  return record.presencas+(record.presencas===1?' presença confirmada':' presenças confirmadas');
}
function renderReply(){
  const record=guestCard,active=!!record.ref;
  if(active && record.lugares===1 && !byId('sender-name').value)byId('sender-name').value=record.convidado;
  const primary=byId('confirm-all'),others=byId('other-replies'),options=byId('reply-options');
  const confirmed=active&&record.presencas===record.lugares;
  byId('reply-actions').hidden=!!(record.loading||record.error);
  primary.textContent=confirmed?'Presença confirmada':'Confirmar presença';
  primary.disabled=replyBusy||confirmed;
  others.hidden=!active;
  setText('rsvp-note',record.loading?'A abrir o convite…':record.error||'');
  setText('reply-guest',active?[record.convidado,record.mesa].filter(Boolean).join(' · '):'');
  const personalHint=record.showLinkHint?'Abra o seu convite pessoal recebido pelo WhatsApp e toque em «Confirmar presença».':'';
  setText('reply-status',record.presencas==null?personalHint:describeReply(record)+(record.participante?' · '+record.participante:'')+'.');
  if(!active)return;
  others.open=false;others.querySelector('summary').textContent=record.presencas==null?'Outras opções de resposta':'Alterar resposta';
  options.replaceChildren();
  const add=(label,count,person='')=>{
    const button=el('button','reply-option',label);button.type='button';button.disabled=replyBusy;
    button.onclick=()=>saveReply(count,person);options.append(button);
  };
  if(record.lugares===2){
    const pair=record.convidado.split(/\s+e\s+|\s*&\s*/i).map(s=>s.trim()).filter(Boolean);
    if(pair.length===2){for(const person of pair)add('Só '+person+' estará presente',1,person);}
    else{
      const partial=el('form','partial-reply'),label=el('label','','Se apenas uma pessoa puder ir, indique o nome.');
      const input=el('input');input.maxLength=150;input.required=true;label.append(input);
      const submit=el('button','reply-option','Confirmar uma pessoa');submit.type='submit';
      partial.append(label,submit);partial.onsubmit=e=>{e.preventDefault();if(input.value.trim())saveReply(1,input.value.trim());};options.append(partial);
    }
  }
  if(record.presencas!==0)add(record.lugares===2?'Não poderemos comparecer':'Não poderei comparecer',0);
  // A single guest who already declined can still confirm with the primary button.
  others.hidden=!options.childElementCount;
}
async function saveReply(count,person=''){
  const record=guestCard;
  if(replyBusy||!record.ref)return;
  stopReading();replyBusy=true;
  const actions=byId('reply-actions');
  actions.querySelectorAll('button').forEach(b=>{b.disabled=true;});
  setText('reply-status','A guardar…');
  try{
    const input={presencas:count,participante:person};
    const saved=await attendanceRequest('/api/resposta/'+encodeURIComponent(record.ref),input);
    if(record!==guestCard)return;
    Object.assign(record,saved);
    replyBusy=false;renderReply();
    setText('reply-status','Resposta guardada. '+describeReply(record)+(person?' · '+person:'')+'.');
  }catch(error){
    if(record===guestCard){replyBusy=false;renderReply();setText('reply-status',error.message);}
  }finally{replyBusy=false;if(record!==guestCard)renderReply();}
}
byId('confirm-all').onclick=()=>{
  if(guestCard.ref)return saveReply(guestCard.lugares);
  stopReading();
  guestCard.showLinkHint=true;
  renderReply();
};
byId('reply-actions').addEventListener('focusin',()=>stopReading());
let lastMessageRequest=null;
const messageForm=byId('guest-message-form');
messageForm.addEventListener('focusin',stopReading);
messageForm.onsubmit=async event=>{
  event.preventDefault();
  const button=byId('send-message');
  if(button.disabled)return;
  const nome=byId('sender-name').value.trim(),texto=byId('message-text').value.trim();
  if(!nome||!texto){setText('send-status','Indique o seu nome e escreva uma mensagem.');return;}
  if(!lastMessageRequest||lastMessageRequest.nome!==nome||lastMessageRequest.texto!==texto){
    lastMessageRequest={pedido:crypto.randomUUID(),nome,texto};
  }
  button.disabled=true;byId('message-text').readOnly=true;byId('sender-name').readOnly=true;
  setText('send-status','A enviar…');
  try{
    await attendanceRequest('/api/mensagens',lastMessageRequest);
    lastMessageRequest=null;byId('message-text').value='';
    setText('send-status','A sua mensagem foi recebida. Obrigado pelo carinho!');
  }catch(error){setText('send-status',error.message);}
  finally{button.disabled=false;byId('message-text').readOnly=false;byId('sender-name').readOnly=false;}
};

</script>
</body></html>
